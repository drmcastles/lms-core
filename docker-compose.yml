version: '3.8'

services:
  db:
    image: postgres:15
    container_name: lms-db
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1151"
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: lms-app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lms_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1151"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db